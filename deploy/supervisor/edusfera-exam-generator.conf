[program:edusfera-exam-generator]
process_name=%(program_name)s
command=/usr/bin/node /var/www/edusfera.by/edusfera-exam-generator/src/server.js
directory=/var/www/edusfera.by/edusfera-exam-generator
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=15
startsecs=3
redirect_stderr=true
stdout_logfile=/var/www/edusfera.by/storage/logs/exam-generator.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=NODE_ENV="production",HOST="127.0.0.1",PORT="3005",RENDER_CONCURRENCY="3",BROWSER_RESTART_THRESHOLD="400",CHROME_EXECUTABLE_PATH="/usr/bin/chromium"

[program:edusfera-queue-exams]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/edusfera.by/artisan queue:work --queue=exams,default --sleep=1 --tries=3 --max-time=3600 --timeout=120
directory=/var/www/edusfera.by
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/edusfera.by/storage/logs/worker-exams.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

